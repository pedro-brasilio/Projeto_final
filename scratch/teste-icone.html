<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Variações Claquete</title>
  <style>
    body {
      background: #0e1220;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #161d32;
      border: 1px solid rgba(96, 80, 220, 0.25);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      min-width: 140px;
    }
    .nav-demo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(96, 80, 220, 0.12);
      color: #94a3b8;
      cursor: pointer;
      border: 1px solid rgba(96, 80, 220, 0.28);
    }
    .nav-demo:hover {
      background: #6050DC;
      color: #ffffff;
    }
    .nav-demo.recolhida {
      width: 40px;
      height: 40px;
      padding: 0;
      justify-content: center;
    }
    .nav-demo svg {
      width: 20px;
      height: 20px;
    }
    .orig-img {
      width: 48px;
      height: 48px;
      filter: invert(1);
    }
  </style>
</head>
<body>
  <h2>Modelos de Ícone para Catálogo Filmes</h2>
  <div class="grid">
    <div class="card">
      <h4>Original do Usuário</h4>
      <img src="../imag/claquete-filmes.png" class="orig-img">
    </div>

    <div class="card">
      <h4>V1 - Traço Outline</h4>
      <div class="nav-demo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" />
          <line x1="2" y1="14.5" x2="22" y2="14.5" />
          <line x1="6" y1="14.5" x2="9" y2="10.5" />
          <line x1="11" y1="14.5" x2="14" y2="10.5" />
          <line x1="16" y1="14.5" x2="19" y2="10.5" />
          <g transform="rotate(-16, 2, 9.5)">
            <rect x="2" y="5.5" width="20" height="4" rx="1.5" />
            <line x1="6" y1="9.5" x2="9" y2="5.5" />
            <line x1="11" y1="9.5" x2="14" y2="5.5" />
            <line x1="16" y1="9.5" x2="19" y2="5.5" />
          </g>
        </svg>
        <span>Catálogo Filmes</span>
      </div>
      <div class="nav-demo recolhida">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" />
          <line x1="2" y1="14.5" x2="22" y2="14.5" />
          <line x1="6" y1="14.5" x2="9" y2="10.5" />
          <line x1="11" y1="14.5" x2="14" y2="10.5" />
          <line x1="16" y1="14.5" x2="19" y2="10.5" />
          <g transform="rotate(-16, 2, 9.5)">
            <rect x="2" y="5.5" width="20" height="4" rx="1.5" />
            <line x1="6" y1="9.5" x2="9" y2="5.5" />
            <line x1="11" y1="9.5" x2="14" y2="5.5" />
            <line x1="16" y1="9.5" x2="19" y2="5.5" />
          </g>
        </svg>
      </div>
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#6050DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" />
        <line x1="2" y1="14.5" x2="22" y2="14.5" />
        <line x1="6" y1="14.5" x2="9" y2="10.5" />
        <line x1="11" y1="14.5" x2="14" y2="10.5" />
        <line x1="16" y1="14.5" x2="19" y2="10.5" />
        <g transform="rotate(-16, 2, 9.5)">
          <rect x="2" y="5.5" width="20" height="4" rx="1.5" />
          <line x1="6" y1="9.5" x2="9" y2="5.5" />
          <line x1="11" y1="9.5" x2="14" y2="5.5" />
          <line x1="16" y1="9.5" x2="19" y2="5.5" />
        </g>
      </svg>
    </div>

    <div class="card">
      <h4>V2 - Listras Preenchidas (Filled Stripes)</h4>
      <div class="nav-demo">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <!-- Corpo inferior contorno -->
          <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" fill="none" stroke-width="2" />
          <line x1="2" y1="14.5" x2="22" y2="14.5" stroke-width="2" />
          <!-- Blocos preenchidos na faixa inferior -->
          <polygon points="2,10.5 4.5,10.5 2,14.5" stroke="none" />
          <polygon points="7,10.5 10,10.5 7.5,14.5 4.5,14.5" stroke="none" />
          <polygon points="12.5,10.5 15.5,10.5 13,14.5 10,14.5" stroke="none" />
          <polygon points="18,10.5 21,10.5 18.5,14.5 15.5,14.5" stroke="none" />
          <!-- Barra superior articulada com blocos preenchidos -->
          <g transform="rotate(-16, 2, 9.5)">
            <rect x="2" y="5.5" width="20" height="4" rx="1.5" fill="none" stroke-width="2" />
            <polygon points="2,5.5 4.5,5.5 2,9.5" stroke="none" />
            <polygon points="7,5.5 10,5.5 7.5,9.5 4.5,9.5" stroke="none" />
            <polygon points="12.5,5.5 15.5,5.5 13,9.5 10,9.5" stroke="none" />
            <polygon points="18,5.5 21,5.5 18.5,9.5 15.5,9.5" stroke="none" />
          </g>
        </svg>
        <span>Catálogo Filmes</span>
      </div>
      <div class="nav-demo recolhida">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" fill="none" stroke-width="2" />
          <line x1="2" y1="14.5" x2="22" y2="14.5" stroke-width="2" />
          <polygon points="2,10.5 4.5,10.5 2,14.5" stroke="none" />
          <polygon points="7,10.5 10,10.5 7.5,14.5 4.5,14.5" stroke="none" />
          <polygon points="12.5,10.5 15.5,10.5 13,14.5 10,14.5" stroke="none" />
          <polygon points="18,10.5 21,10.5 18.5,14.5 15.5,14.5" stroke="none" />
          <g transform="rotate(-16, 2, 9.5)">
            <rect x="2" y="5.5" width="20" height="4" rx="1.5" fill="none" stroke-width="2" />
            <polygon points="2,5.5 4.5,5.5 2,9.5" stroke="none" />
            <polygon points="7,5.5 10,5.5 7.5,9.5 4.5,9.5" stroke="none" />
            <polygon points="12.5,5.5 15.5,5.5 13,9.5 10,9.5" stroke="none" />
            <polygon points="18,5.5 21,5.5 18.5,9.5 15.5,9.5" stroke="none" />
          </g>
        </svg>
      </div>
      <svg viewBox="0 0 24 24" width="48" height="48" fill="#6050DC" stroke="#6050DC" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="10.5" width="20" height="10.5" rx="2.5" fill="none" stroke-width="2" />
        <line x1="2" y1="14.5" x2="22" y2="14.5" stroke-width="2" />
        <polygon points="2,10.5 4.5,10.5 2,14.5" stroke="none" />
        <polygon points="7,10.5 10,10.5 7.5,14.5 4.5,14.5" stroke="none" />
        <polygon points="12.5,10.5 15.5,10.5 13,14.5 10,14.5" stroke="none" />
        <polygon points="18,10.5 21,10.5 18.5,14.5 15.5,14.5" stroke="none" />
        <g transform="rotate(-16, 2, 9.5)">
          <rect x="2" y="5.5" width="20" height="4" rx="1.5" fill="none" stroke-width="2" />
          <polygon points="2,5.5 4.5,5.5 2,9.5" stroke="none" />
          <polygon points="7,5.5 10,5.5 7.5,9.5 4.5,9.5" stroke="none" />
          <polygon points="12.5,5.5 15.5,5.5 13,9.5 10,9.5" stroke="none" />
          <polygon points="18,5.5 21,5.5 18.5,9.5 15.5,9.5" stroke="none" />
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
